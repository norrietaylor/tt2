name: Unity Build

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  preflight:
    name: Preflight Checks
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run preflight checks
        run: ./scripts/preflight.sh
  test:
    needs: preflight
    name: Run EditMode Tests
    # Skip this job for pull requests from forks because secrets are not
    # available to fork workflows and the build would fail.
    if: >
      github.event_name == 'push' ||
      (github.event_name == 'pull_request' &&
       github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: true

      - name: Cache Unity Library
        uses: actions/cache@v4
        with:
          path: Unity/Library
          key: Library-test-${{ hashFiles('Unity/Assets/**', 'Unity/Packages/**', 'Unity/ProjectSettings/**') }}
          restore-keys: |
            Library-test-
            Library-

      - name: Cache Docker image
        uses: actions/cache@v4
        with:
          path: /home/runner/.docker-cache
          key: docker-unity-2022.3.20f1-il2cpp-3
          restore-keys: docker-unity-

      - name: Load cached Docker image
        run: |
          if [ -f /home/runner/.docker-cache/unity-image.tar ]; then
            docker load -i /home/runner/.docker-cache/unity-image.tar
            echo "Docker image loaded from cache"
          else
            echo "No cached image found — will pull fresh"
          fi

      - name: Run EditMode tests
        id: tests
        uses: game-ci/unity-test-runner@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          projectPath: Unity
          testMode: editmode
          artifactsPath: test-results
          githubToken: ${{ secrets.GITHUB_TOKEN }}
          customParameters: -nographics

      - name: Save Docker image to cache
        if: always()
        run: |
          IMAGE=$(docker images --format '{{.Repository}}:{{.Tag}}' | grep unityci | head -1)
          if [ -n "$IMAGE" ] && [ ! -f /home/runner/.docker-cache/unity-image.tar ]; then
            mkdir -p /home/runner/.docker-cache
            docker save "$IMAGE" -o /home/runner/.docker-cache/unity-image.tar
            echo "Saved $IMAGE to cache"
          fi

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results-editmode
          path: test-results

  build:
    needs: test
    name: Build for ${{ matrix.targetPlatform }}
    # Skip this job for pull requests from forks because secrets are not
    # available to fork workflows and the build would fail.
    if: >
      github.event_name == 'push' ||
      (github.event_name == 'pull_request' &&
       github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ${{ matrix.targetPlatform == 'iOS' && 'macos-latest' || 'ubuntu-latest' }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        targetPlatform:
          - WebGL
          - iOS
          - Android
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Cache Unity Library
        uses: actions/cache@v4
        with:
          path: Unity/Library
          key: Library-${{ matrix.targetPlatform }}-${{ hashFiles('Unity/Assets/**', 'Unity/Packages/**', 'Unity/ProjectSettings/**') }}
          restore-keys: |
            Library-${{ matrix.targetPlatform }}-
            Library-

      - name: Build Unity project
        uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          projectPath: Unity
          targetPlatform: ${{ matrix.targetPlatform }}

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: Build-${{ matrix.targetPlatform }}
          path: build/${{ matrix.targetPlatform }}
